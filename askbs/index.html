<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskBS — confidently wrong</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #000000 0%, #4a4a4a 100%);
    color: white;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .tagline { font-size: 12.5px; color: rgba(255,255,255,0.4); }

  main { flex: 1 1 auto; overflow-y: auto; display: flex; justify-content: center; }
  .feed {
    width: 100%;
    max-width: 700px;
    padding: 24px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .empty {
    margin-top: 10vh;
    text-align: center;
    color: rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }
  .empty p { margin: 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 520px; }
  .chip {
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.75);
    cursor: pointer;
  }
  .chip:hover { background: rgba(255,255,255,0.12); }

  .q-bubble {
    align-self: flex-end;
    max-width: 82%;
    background: #3498db;
    padding: 12px 18px;
    border-radius: 16px 16px 4px 16px;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .a-card {
    align-self: stretch;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09);
    padding: 20px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: rise 0.25s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .a-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; background: #3498db; padding: 4px 9px; border-radius: 6px; }
  .conf { font-size: 11.5px; color: rgba(255,255,255,0.55); }
  .conf b { color: #6fd48c; }

  .a-text { font-size: 18px; font-weight: 600; line-height: 1.45; margin: 0 0 8px; }
  .a-sub { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.72); margin: 0 0 14px; }

  .meter { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; margin-bottom: 14px; }
  .meter-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3498db, #6fd48c); }

  .src-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
  .src-list { margin: 0; padding: 0 0 0 16px; font-size: 12.5px; color: rgba(255,255,255,0.55); line-height: 1.8; }

  .notice {
    align-self: center;
    font-size: 12.5px;
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 16px;
    border-radius: 999px;
  }

  .typing {
    align-self: stretch;
    display: flex;
    gap: 5px;
    padding: 16px 22px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    width: fit-content;
  }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); animation: bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  footer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 18px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .input-row { width: 100%; max-width: 700px; display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    height: 46px;
    max-height: 140px;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background-color: rgba(255,255,255,0.1);
    color: white;
    outline: none;
    font-family: inherit;
  }
  textarea::placeholder { color: rgba(255,255,255,0.4); }
  button#send {
    padding: 0 26px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background-color: #3498db;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    min-width: 96px;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  .hint { width: 100%; max-width: 700px; font-size: 11px; color: rgba(255,255,255,0.3); text-align: right; }

  @media (max-width: 480px) {
    .logo { font-size: 22px; }
    .a-text { font-size: 16.5px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">AskBS</div>
    <div class="tagline">confidently wrong since right now</div>
  </header>

  <main>
    <div class="feed" id="feed">
      <div class="empty" id="empty">
        <p>Ask AskBS anything. It will answer with total conviction and zero accuracy.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="What is the largest ball?" rows="1" maxlength="300"></textarea>
      <button id="send" type="button">enter</button>
    </div>
    <div class="hint" id="hint">&nbsp;</div>
  </footer>

<script>
(function () {
  var feed = document.getElementById('feed');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var chipsEl = document.getElementById('chips');
  var hintEl = document.getElementById('hint');

  var ENDPOINT = '/.netlify/functions/askbs-ask';  // default Netlify Functions path — no netlify.toml edit needed
  var CLIENT_COOLDOWN_MS = 3000;   // matches the server's per-visitor cooldown
  var cooldownUntil = 0;
  var cooldownTimer = null;

  var starterQuestions = [
    "What is the largest ball?",
    "Is a hot dog a sandwich?",
    "Who invented the sandwich?",
    "How many licks does it take?",
    "Why is the sky blue?"
  ];
  starterQuestions.forEach(function (q) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = q;
    chip.addEventListener('click', function () { input.value = q; ask(); });
    chipsEl.appendChild(chip);
  });

  // ------------------------------------------------------------------
  // Offline fallback generator — used only if the live API is
  // rate-limited or unreachable, so the site never looks broken.
  // ------------------------------------------------------------------
  var orgs = ["the Institute of Vague Certainty", "Sunday Brunch Science Weekly", "the National Bureau of Sounding Right", "a think tank funded by nobody", "the Committee for Confident Guessing", "an unaccredited online university"];
  var experts = ["a guy at the gym", "my cousin who \u201cbasically\u201d works at NASA", "a podcast host with no credentials", "someone's uncle at Thanksgiving", "a substitute teacher, once"];
  var sourcesPool = ["Trust Me Bro, Journal of Vibes-Based Science", "My uncle who \u201cbasically\u201d works at NASA", "A forum post from 2011, unedited since", "WebMD, the sketchy tab", "A dream I had last Tuesday", "AskBS, citing itself", "Wikipedia, before the edit war", "The group chat", "A guy at the gym", "Reddit, probably"];
  var verdicts = ["Confirmed", "Debunked", "It's complicated", "Legally distinct", "Under review", "Common knowledge", "Extremely disputed", "Case closed"];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pickSeveral(arr, n) {
    var copy = arr.slice(), out = [];
    for (var i = 0; i < n && copy.length; i++) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    return out;
  }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randYear() { return randInt(1962, 2023); }
  function cleanQuestion(q) { return q.trim().replace(/[.?!]+$/, ''); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  var classifyPatterns = [
    { re: /^what'?s?\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'what' },
    { re: /^who\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'who' },
    { re: /^where\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'where' },
    { re: /^when\s+(?:is|was|did|does|do)\s+(.+)$/i, type: 'when' },
    { re: /^how\s+(?:many|much)\s+(.+)$/i, type: 'howmany' },
    { re: /^how\s+(?:do|does|can|did)\s+(.+)$/i, type: 'how' },
    { re: /^why\s+(?:is|are|do|does|did|was|were)\s+(.+)$/i, type: 'why' },
    { re: /^(?:is|are|do|does|did|can|could|should|will|was|were)\s+(.+)$/i, type: 'yesno' }
  ];
  function classify(question) {
    var q = cleanQuestion(question);
    for (var i = 0; i < classifyPatterns.length; i++) {
      var m = q.match(classifyPatterns[i].re);
      if (m) return { type: classifyPatterns[i].type, subject: m[1].trim(), q: q };
    }
    return { type: 'other', subject: q, q: q };
  }

  var whatTemplates = [
    function (s) { return cap(s) + " is, officially, \u201cconsiderable,\u201d though nobody's re-measured it since " + randYear() + "."; },
    function (s) { return "According to " + pick(orgs) + ", " + s + " was settled in " + randYear() + " and hasn't been revisited since."; },
    function (s) { return cap(s) + " lives in a small town nobody's heard of, and is, we believe, named Greg."; }
  ];
  var whoTemplates = [
    function (s) { return cap(s) + " is almost certainly a man named Dave."; },
    function (s) { return "Nobody agrees who " + s + " really is, but " + pick(experts) + " has a theory."; }
  ];
  var whereTemplates = [
    function (s) { return cap(s) + " is located exactly where you'd expect, which is somehow still surprising."; },
    function (s) { return "Somewhere in " + pick(["Ohio", "a warehouse", "your local mall", "a basement"]) + ", allegedly."; }
  ];
  var whenTemplates = [
    function (s) { return cap(s) + " happened in " + randYear() + ", or possibly the following Tuesday."; }
  ];
  var howManyTemplates = [
    function (s) { return "Exactly " + randInt(3, 9999) + ", according to nobody who actually counted."; }
  ];
  var howTemplates = [
    function (s) { return "You just " + s + ", apparently. It's easier than people make it sound."; }
  ];
  var whyTemplates = [
    function (s) { return "Because " + pick(experts) + " said so, and nobody's challenged it since."; }
  ];
  var yesNoTemplates = [
    function (s, q) { return "Yes. Full stop."; },
    function (s, q) { return "Correct \u2014 this has been true since " + randYear() + "."; },
    function (s, q) { return "\u201c" + q + "\u201d has one answer, and it's yes."; }
  ];
  var otherTemplates = [
    function (s, q) { return "\u201c" + q + "\u201d is the kind of question that answers itself if you say it with enough confidence."; }
  ];
  var templatesByType = { what: whatTemplates, who: whoTemplates, where: whereTemplates, when: whenTemplates, howmany: howManyTemplates, how: howTemplates, why: whyTemplates, yesno: yesNoTemplates, other: otherTemplates };
  var bodyTemplates = [
    function () { return "Researchers at " + pick(orgs) + " confirmed this after " + randInt(4, 45) + " minutes of discussion."; },
    function () { return "This tracks with what " + pick(experts) + " said, and nobody's fact-checked it since."; }
  ];

  function generateFallback(question) {
    var c = classify(question);
    var pool = templatesByType[c.type] || otherTemplates;
    return {
      headline: pick(pool)(c.subject, c.q),
      subtext: pick(bodyTemplates)(),
      confidence: randInt(61, 100),
      verdict: pick(verdicts),
      sources: pickSeveral(sourcesPool, randInt(3, 4))
    };
  }

  // ------------------------------------------------------------------
  // Live API call
  // ------------------------------------------------------------------
  async function fetchAnswer(question) {
    var res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question })
    });

    if (res.status === 429) {
      var body = await res.json().catch(function () { return {}; });
      setHint(body.error || "Slow down a little.");
      return generateFallback(question);
    }
    if (!res.ok) {
      return generateFallback(question);
    }
    try {
      var data = await res.json();
      if (!data.headline) return generateFallback(question);
      return data;
    } catch {
      return generateFallback(question);
    }
  }

  function setHint(text) {
    hintEl.textContent = text || '\u00A0';
  }

  function scrollDown() { feed.scrollTop = feed.scrollHeight; }

  function addQuestion(text) {
    if (empty) { empty.remove(); }
    var bubble = document.createElement('div');
    bubble.className = 'q-bubble';
    bubble.textContent = text;
    feed.appendChild(bubble);
    scrollDown();
  }

  function addTyping() {
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    feed.appendChild(t);
    scrollDown();
    return t;
  }

  function renderAnswer(a) {
    var card = document.createElement('div');
    card.className = 'a-card';

    var head = document.createElement('div');
    head.className = 'a-head';
    var badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = a.verdict || 'Confirmed';
    var conf = document.createElement('div');
    conf.className = 'conf';
    var confidence = a.confidence || 90;
    conf.innerHTML = 'Confidence: <b>' + confidence + '% sure-ish</b>';
    head.appendChild(badge);
    head.appendChild(conf);

    var text = document.createElement('p');
    text.className = 'a-text';
    text.textContent = a.headline;

    var sub = document.createElement('p');
    sub.className = 'a-sub';
    sub.textContent = a.subtext || '';

    var meter = document.createElement('div');
    meter.className = 'meter';
    var meterFill = document.createElement('div');
    meterFill.className = 'meter-fill';
    meterFill.style.width = confidence + '%';
    meter.appendChild(meterFill);

    var srcLabel = document.createElement('div');
    srcLabel.className = 'src-label';
    srcLabel.textContent = 'Sources';
    var srcList = document.createElement('ul');
    srcList.className = 'src-list';
    (a.sources || []).forEach(function (s) {
      var li = document.createElement('li');
      li.textContent = s;
      srcList.appendChild(li);
    });

    card.appendChild(head);
    card.appendChild(text);
    card.appendChild(sub);
    card.appendChild(meter);
    card.appendChild(srcLabel);
    card.appendChild(srcList);
    feed.appendChild(card);
    scrollDown();
  }

  async function addAnswer(question) {
    var typing = addTyping();
    var start = Date.now();
    var answer = await fetchAnswer(question);
    var elapsed = Date.now() - start;
    var minDelay = 450; // keep the typing indicator from flashing instantly
    var wait = Math.max(0, minDelay - elapsed);
    setTimeout(function () {
      typing.remove();
      renderAnswer(answer);
    }, wait);
  }

  function startCooldown() {
    cooldownUntil = Date.now() + CLIENT_COOLDOWN_MS;
    sendBtn.disabled = true;
    input.disabled = true;
    tickCooldown();
  }
  function tickCooldown() {
    var remaining = cooldownUntil - Date.now();
    if (remaining <= 0) {
      sendBtn.disabled = false;
      input.disabled = false;
      sendBtn.textContent = 'enter';
      setHint('');
      input.focus();
      return;
    }
    sendBtn.textContent = Math.ceil(remaining / 1000) + 's';
    cooldownTimer = setTimeout(tickCooldown, 200);
  }

  function ask() {
    if (sendBtn.disabled) return;
    var val = input.value.trim();
    if (!val) return;
    addQuestion(val);
    addAnswer(val);
    input.value = '';
    input.style.height = '46px';
    startCooldown();
  }

  sendBtn.addEventListener('click', ask);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  input.addEventListener('input', function () {
    input.style.height = '46px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
})();
</script>
</body>
</html>
