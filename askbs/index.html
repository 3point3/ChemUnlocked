<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskBS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #000000 0%, #4a4a4a 100%);
    color: white;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .tagline { font-size: 12.5px; color: rgba(255,255,255,0.4); }

  main { flex: 1 1 auto; overflow-y: auto; display: flex; justify-content: center; }
  .feed {
    width: 100%;
    max-width: 700px;
    padding: 24px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .empty {
    margin-top: 10vh;
    text-align: center;
    color: rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }
  .empty p { margin: 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 520px; }
  .chip {
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.75);
    cursor: pointer;
  }
  .chip:hover { background: rgba(255,255,255,0.12); }

  .q-bubble {
    align-self: flex-end;
    max-width: 82%;
    background: #3498db;
    padding: 12px 18px;
    border-radius: 16px 16px 4px 16px;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .a-card {
    align-self: stretch;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09);
    padding: 20px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: rise 0.25s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .a-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.68); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); padding: 4px 9px; border-radius: 6px; }
  .conf { font-size: 11.5px; color: rgba(255,255,255,0.55); }
  .conf b { color: #6fd48c; }

  .a-text { font-size: 18px; font-weight: 600; line-height: 1.45; margin: 0 0 8px; }
  .a-sub { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.72); margin: 0 0 12px; }

  .meter { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; margin-bottom: 10px; }
  .meter-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3498db, #6fd48c); }

  .cite { font-size: 11px; font-style: italic; color: rgba(255,255,255,0.32); }

  .notice {
    align-self: center;
    font-size: 12.5px;
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 16px;
    border-radius: 999px;
  }

  .typing {
    align-self: stretch;
    display: flex;
    gap: 5px;
    padding: 16px 22px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    width: fit-content;
  }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); animation: bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  footer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 18px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .input-row { width: 100%; max-width: 700px; display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    height: 46px;
    max-height: 140px;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background-color: rgba(255,255,255,0.1);
    color: white;
    outline: none;
    font-family: inherit;
  }
  textarea::placeholder { color: rgba(255,255,255,0.4); }
  button#send {
    padding: 0 26px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background-color: #3498db;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    min-width: 96px;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  .hint { width: 100%; max-width: 700px; font-size: 11px; color: rgba(255,255,255,0.3); text-align: right; }

  @media (max-width: 480px) {
    .logo { font-size: 22px; }
    .a-text { font-size: 16.5px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">AskBS</div>
    <div class="tagline">we don't factcheck</div>
  </header>

  <main>
    <div class="feed" id="feed">
      <div class="empty" id="empty">
        <p>Ask a question. Get an answer.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="What is the largest ball?" rows="1" maxlength="300"></textarea>
      <button id="send" type="button">enter</button>
    </div>
    <div class="hint" id="hint">&nbsp;</div>
  </footer>

<script>
(function () {
  var feed = document.getElementById('feed');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var chipsEl = document.getElementById('chips');
  var hintEl = document.getElementById('hint');

  var CLIENT_COOLDOWN_MS = 3000;   // just paces clicks — no server involved right now
  var cooldownUntil = 0;
  var cooldownTimer = null;

  // Large question bank — a handful are shuffled in on each visit so
  // regulars see a different mix instead of the same five chips.
  var questionBank = [
    "What is the largest ball?", "Is a hot dog a sandwich?", "Who invented the sandwich?",
    "How many licks does it take to get to the center of a lollipop?", "Why is the sky blue?",
    "What's the deepest part of the ocean?", "Who built the pyramids?", "How fast can a snail travel?",
    "What causes hiccups?", "Why do cats purr?", "What's inside a black hole?",
    "How many bones are in the human hand?", "Who invented pizza?", "What language do dolphins speak?",
    "Why does popcorn pop?", "How old is the internet?", "What's the tallest mountain, really?",
    "Do fish sleep?", "Why do we dream?", "What's the oldest joke in the world?",
    "How many people have been to space?", "Why is Tuesday named Tuesday?", "What's the smallest country?",
    "Do bees have feelings?", "Who really invented the wheel?", "What's the best way to boil an egg?",
    "Why do we get brain freeze?", "How long do goldfish actually live?", "What's the loudest sound ever recorded?",
    "Why do onions make you cry?", "Who decided time zones?", "What's the most expensive coffee in the world?",
    "Why do we yawn?", "How many stars are in the sky?", "What's the world's oldest recipe?",
    "Do plants feel pain?", "Why is the ocean salty?", "What was the first video game?",
    "How do bees make honey?", "Why do we have eyebrows?", "What's the fastest land animal?",
    "Who invented the umbrella?", "Why does time seem to fly as you get older?", "What's the origin of the handshake?",
    "How many hearts does an octopus have?", "Why do we get goosebumps?", "What's the most common phobia?",
    "Who invented the toothbrush?", "Why do birds fly in a V formation?", "What's the world's oldest language?",
    "Why do we get static electricity in winter?", "What's the fastest fish in the ocean?", "Who invented the fork?",
    "Why do onions have layers?", "What's the world's oldest currency?", "How many time zones does Russia have?",
    "Why do we have belly buttons?", "What's the tallest building in the world, really?", "Who invented chess?",
    "Why does the moon look bigger near the horizon?", "What's the world's spiciest pepper?", "How many muscles does it take to smile?",
    "Why do we blush?", "What's the oldest tree in the world?", "Who invented the yo-yo?",
    "Why do we have fingerprints?", "What's the largest desert on Earth?", "How do birds know which way to migrate?",
    "Why does bacon smell so good?", "What's the world's most popular sport?", "Who invented the traffic light?",
    "Why do we get earworms (songs stuck in our head)?", "What's the coldest place on Earth?", "How many taste buds does a human have?",
    "Why do dogs tilt their heads?", "What's the world's oldest company?", "Who invented the alphabet?",
    "Why does hair turn gray?", "What's the fastest a human has ever run?", "How deep can a submarine go?",
    "Why do we cry when we're happy?", "What's the largest waterfall in the world?", "Who invented the calendar?",
    "Why do cats knead with their paws?", "What's the most spoken language in the world?", "How long can a person survive without sleep?",
    "Why do we get déjà vu?", "What's the largest snake in the world?", "Who invented the light bulb, really?",
    "Why do leaves change color in the fall?", "What's the driest place on Earth?", "How many hairs does the average human have?",
    "Why do we get hiccups after eating too fast?", "What's the oldest board game?", "Who invented money?",
    "Why do zebras have stripes?", "What's the largest living organism?", "How many people can Earth actually support?",
    "Why does the moon have phases?", "What's the world's most expensive spice?"
  ];
  function shuffle(arr) {
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
    }
    return copy;
  }
  var STARTER_COUNT = 5;
  var starterQuestions = shuffle(questionBank).slice(0, STARTER_COUNT);
  starterQuestions.forEach(function (q) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = q;
    chip.addEventListener('click', function () { input.value = q; ask(); });
    chipsEl.appendChild(chip);
  });

  // ------------------------------------------------------------------
  // Answer generator — fully client-side, no API/server involved.
  // (This started life as an offline fallback for when a live model
  // API was rate-limited/unreachable; for now it's the only answer
  // source. See netlify/functions/askbs-ask.js in git history if
  // that comes back later.)
  // ------------------------------------------------------------------
  var orgs = ["the Institute for Applied Certainty", "the Center for Quantitative Confidence", "the National Laboratory of General Findings", "the Bureau of Applied Statistics", "the Institute for Empirical Consensus", "the Division of Observational Studies", "the Center for Replication Studies", "the Laboratory of Applied Inference"];
  var evidence = ["a peer-reviewed study", "a large-scale meta-analysis", "a controlled longitudinal study", "an independent replication study", "a preliminary data analysis", "a multi-year observational study", "a randomized controlled trial", "an internal research review"];
  var sourcesPool = ["Journal of Applied Certainty (2019)", "Center for General Knowledge, internal report", "Quarterly Review of Empirical Findings", "Dept. of Applied Statistics", "Public Understanding Survey, 2021", "Institute for Empirical Consensus", "National Archive of Observational Data", "Field Notes, unpublished", "Annual Review of Applied Research", "Bulletin of Quantitative Studies, vol. 12", "Working Paper, Center for Applied Certainty", "Proceedings of the Society for Applied Research"];
  var verdicts = ["Confirmed", "Verified", "Established", "Widely accepted", "Under review", "Disputed", "Unconfirmed", "Preliminary finding", "Common knowledge"];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pickSeveral(arr, n) {
    var copy = arr.slice(), out = [];
    for (var i = 0; i < n && copy.length; i++) out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    return out;
  }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randYear() { return randInt(1962, 2023); }
  function cleanQuestion(q) { return q.trim().replace(/[.?!]+$/, ''); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  var classifyPatterns = [
    { re: /^what'?s?\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'what' },
    { re: /^who\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'who' },
    { re: /^where\s+(?:is|are|was|were)\s+(?:the\s+)?(.+)$/i, type: 'where' },
    { re: /^when\s+(?:is|was|did|does|do)\s+(.+)$/i, type: 'when' },
    { re: /^how\s+(?:many|much)\s+(.+)$/i, type: 'howmany' },
    { re: /^how\s+(?:do|does|can|did)\s+(.+)$/i, type: 'how' },
    { re: /^why\s+(?:is|are|do|does|did|was|were)\s+(.+)$/i, type: 'why' },
    { re: /^(?:is|are|do|does|did|can|could|should|will|was|were)\s+(.+)$/i, type: 'yesno' }
  ];
  function classify(question) {
    var q = cleanQuestion(question);
    for (var i = 0; i < classifyPatterns.length; i++) {
      var m = q.match(classifyPatterns[i].re);
      if (m) return { type: classifyPatterns[i].type, subject: m[1].trim(), q: q };
    }
    return { type: 'other', subject: q, q: q };
  }

  var whatTemplates = [
    function (s) { return cap(s) + " is, by the most recent estimate, \u201cconsiderable,\u201d though it hasn't been re-measured since " + randYear() + "."; },
    function (s) { return "According to " + pick(orgs) + ", " + s + " was established in " + randYear() + " and hasn't been revisited since."; },
    function (s) { return "The best available data put " + s + " at a figure nobody has since disputed."; }
  ];
  var whoTemplates = [
    function (s) { return "The data most consistently point to a single individual, provisionally identified as Dave."; },
    function (s) { return "Nobody agrees who " + s + " really is, but " + pick(evidence) + " points to one leading candidate."; }
  ];
  var whereTemplates = [
    function (s) { return cap(s) + " is located exactly where the data suggest, which is somehow still surprising."; },
    function (s) { return "Located in " + pick(["Ohio", "an undisclosed facility", "a regional research site", "a climate-controlled warehouse"]) + ", per the most recent survey."; }
  ];
  var whenTemplates = [
    function (s) { return cap(s) + " occurred in " + randYear() + ", according to the earliest reliable record."; }
  ];
  var howManyTemplates = [
    function (s) { return "Exactly " + randInt(3, 9999) + ", per the most recent (uncorroborated) count."; }
  ];
  var howTemplates = [
    function (s) { return "You just " + s + " \u2014 the mechanism is simpler than most accounts suggest."; }
  ];
  var whyTemplates = [
    function (s) { return "Because " + pick(evidence) + " found as much, and nobody's challenged it since."; }
  ];
  var yesNoTemplates = [
    function (s, q) { return "Yes. Full stop."; },
    function (s, q) { return "Correct \u2014 this has held since " + randYear() + "."; },
    function (s, q) { return "\u201c" + q + "\u201d has one answer, and it's yes."; }
  ];
  var otherTemplates = [
    function (s, q) { return "\u201c" + q + "\u201d is the kind of question that answers itself if you say it with enough confidence."; }
  ];
  var templatesByType = { what: whatTemplates, who: whoTemplates, where: whereTemplates, when: whenTemplates, howmany: howManyTemplates, how: howTemplates, why: whyTemplates, yesno: yesNoTemplates, other: otherTemplates };
  var bodyTemplates = [
    function () { return "Researchers at " + pick(orgs) + " reported this finding after a brief internal review."; },
    function () { return "This is consistent with " + pick(evidence) + ", and nobody's fact-checked it since."; }
  ];

  function generateFallback(question) {
    var c = classify(question);
    var pool = templatesByType[c.type] || otherTemplates;
    return {
      headline: pick(pool)(c.subject, c.q),
      subtext: pick(bodyTemplates)(),
      confidence: randInt(61, 100),
      verdict: pick(verdicts),
      sources: pickSeveral(sourcesPool, randInt(1, 2))
    };
  }

  // ------------------------------------------------------------------
  // Answer lookup — no network call, just the local generator.
  // ------------------------------------------------------------------
  async function fetchAnswer(question) {
    return generateFallback(question);
  }

  function setHint(text) {
    hintEl.textContent = text || '\u00A0';
  }

  function scrollDown() { feed.scrollTop = feed.scrollHeight; }

  function addQuestion(text) {
    if (empty) { empty.remove(); }
    var bubble = document.createElement('div');
    bubble.className = 'q-bubble';
    bubble.textContent = text;
    feed.appendChild(bubble);
    scrollDown();
  }

  function addTyping() {
    var t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    feed.appendChild(t);
    scrollDown();
    return t;
  }

  function renderAnswer(a) {
    var card = document.createElement('div');
    card.className = 'a-card';

    var head = document.createElement('div');
    head.className = 'a-head';
    var badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = a.verdict || 'Confirmed';
    var conf = document.createElement('div');
    conf.className = 'conf';
    var confidence = a.confidence || 90;
    conf.innerHTML = 'Confidence: <b>' + confidence + '% sure-ish</b>';
    head.appendChild(badge);
    head.appendChild(conf);

    var text = document.createElement('p');
    text.className = 'a-text';
    text.textContent = a.headline;

    var sub = document.createElement('p');
    sub.className = 'a-sub';
    sub.textContent = a.subtext || '';

    var meter = document.createElement('div');
    meter.className = 'meter';
    var meterFill = document.createElement('div');
    meterFill.className = 'meter-fill';
    meterFill.style.width = confidence + '%';
    meter.appendChild(meterFill);

    var cite = document.createElement('div');
    cite.className = 'cite';
    cite.textContent = (a.sources || []).join(' · ');

    card.appendChild(head);
    card.appendChild(text);
    card.appendChild(sub);
    card.appendChild(meter);
    card.appendChild(cite);
    feed.appendChild(card);
    scrollDown();
  }

  async function addAnswer(question) {
    var typing = addTyping();
    var start = Date.now();
    var answer = await fetchAnswer(question);
    var elapsed = Date.now() - start;
    var minDelay = 450; // keep the typing indicator from flashing instantly
    var wait = Math.max(0, minDelay - elapsed);
    setTimeout(function () {
      typing.remove();
      renderAnswer(answer);
    }, wait);
  }

  function startCooldown() {
    cooldownUntil = Date.now() + CLIENT_COOLDOWN_MS;
    sendBtn.disabled = true;
    input.disabled = true;
    tickCooldown();
  }
  function tickCooldown() {
    var remaining = cooldownUntil - Date.now();
    if (remaining <= 0) {
      sendBtn.disabled = false;
      input.disabled = false;
      sendBtn.textContent = 'enter';
      setHint('');
      input.focus();
      return;
    }
    sendBtn.textContent = Math.ceil(remaining / 1000) + 's';
    cooldownTimer = setTimeout(tickCooldown, 200);
  }

  function ask() {
    if (sendBtn.disabled) return;
    var val = input.value.trim();
    if (!val) return;
    addQuestion(val);
    addAnswer(val);
    input.value = '';
    input.style.height = '46px';
    startCooldown();
  }

  sendBtn.addEventListener('click', ask);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  input.addEventListener('input', function () {
    input.style.height = '46px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
})();
</script>
</body>
</html>
