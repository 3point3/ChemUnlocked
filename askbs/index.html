<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskBS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #000000 0%, #4a4a4a 100%);
    color: white;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; }

  main { flex: 1 1 auto; overflow-y: auto; display: flex; justify-content: center; }
  .feed {
    width: 100%;
    max-width: 700px;
    padding: 24px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .empty {
    margin-top: 10vh;
    text-align: center;
    color: rgba(255,255,255,0.45);
    font-size: 14px;
  }

  .q-bubble {
    align-self: flex-end;
    max-width: 82%;
    background: #3498db;
    padding: 12px 18px;
    border-radius: 16px 16px 4px 16px;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .a-card {
    align-self: stretch;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09);
    padding: 20px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  .a-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.68); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); padding: 4px 9px; border-radius: 6px; }
  .conf { font-size: 11.5px; color: rgba(255,255,255,0.55); }
  .conf b { color: #6fd48c; }

  .a-text { font-size: 18px; font-weight: 600; line-height: 1.45; margin: 0 0 8px; }
  .a-sub { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.72); margin: 0 0 12px; }

  .meter { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); overflow: hidden; margin-bottom: 10px; }
  .meter-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3498db, #6fd48c); }

  .cite { font-size: 11px; font-style: italic; color: rgba(255,255,255,0.32); }

  footer {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 18px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .ask-note { width: 100%; max-width: 700px; font-size: 12px; color: rgba(255,255,255,0.4); }
  .ask-form { width: 100%; max-width: 700px; }
  .input-row { display: flex; gap: 10px; }
  .hidden-field { position: absolute; left: -5000px; }
  textarea {
    flex: 1;
    resize: none;
    height: 46px;
    max-height: 140px;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background-color: rgba(255,255,255,0.1);
    color: white;
    outline: none;
    font-family: inherit;
  }
  textarea::placeholder { color: rgba(255,255,255,0.4); }
  button#send {
    padding: 0 26px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background-color: #3498db;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    min-width: 96px;
  }
  .hint { width: 100%; max-width: 700px; font-size: 12px; color: rgba(255,255,255,0.5); }

  @media (max-width: 480px) {
    .logo { font-size: 22px; }
    .a-text { font-size: 16.5px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">AskBS</div>
  </header>

  <main>
    <div class="feed" id="feed">
      <div class="empty" id="empty">No questions answered yet.</div>
    </div>
  </main>

  <footer>
    <div class="ask-note">Ask something below. Answers get posted here once I get to them.</div>
    <form name="askbs-question" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/askbs/?submitted=1" class="ask-form">
      <input type="hidden" name="form-name" value="askbs-question" />
      <p class="hidden-field"><label>Don't fill this out if you're human: <input name="bot-field" /></label></p>
      <div class="input-row">
        <textarea name="question" id="input" placeholder="Ask something." rows="1" maxlength="300" required></textarea>
        <button id="send" type="submit">ask</button>
      </div>
    </form>
    <div class="hint" id="hint">&nbsp;</div>
  </footer>

<script src="answers.js"></script>
<script>
(function () {
  var feed = document.getElementById('feed');
  var empty = document.getElementById('empty');
  var hintEl = document.getElementById('hint');
  var input = document.getElementById('input');

  if (location.search.indexOf('submitted=1') !== -1) {
    hintEl.textContent = "ChatBS will work hard to find an answer.";
  }

  input.addEventListener('input', function () {
    input.style.height = '46px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  function scrollDown() { feed.scrollTop = feed.scrollHeight; }

  function renderAnswer(a) {
    var bubble = document.createElement('div');
    bubble.className = 'q-bubble';
    bubble.textContent = a.question;

    var card = document.createElement('div');
    card.className = 'a-card';

    var head = document.createElement('div');
    head.className = 'a-head';
    var badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = a.verdict || 'Confirmed';
    var conf = document.createElement('div');
    conf.className = 'conf';
    var confidence = a.confidence || 90;
    conf.innerHTML = 'Confidence: <b>' + confidence + '%</b>';
    head.appendChild(badge);
    head.appendChild(conf);

    var text = document.createElement('p');
    text.className = 'a-text';
    text.textContent = a.headline;

    var sub = document.createElement('p');
    sub.className = 'a-sub';
    sub.textContent = a.subtext || '';

    var meter = document.createElement('div');
    meter.className = 'meter';
    var meterFill = document.createElement('div');
    meterFill.className = 'meter-fill';
    meterFill.style.width = confidence + '%';
    meter.appendChild(meterFill);

    var cite = document.createElement('div');
    cite.className = 'cite';
    cite.textContent = (a.sources || []).join(' · ');

    card.appendChild(head);
    card.appendChild(text);
    card.appendChild(sub);
    card.appendChild(meter);
    card.appendChild(cite);

    feed.appendChild(bubble);
    feed.appendChild(card);
  }

  var data = window.ASKBS_ANSWERS || [];
  if (data.length) {
    if (empty) empty.remove();
    data.slice().reverse().forEach(renderAnswer);
    scrollDown();
  }
})();
</script>
</body>
</html>
