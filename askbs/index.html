<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskBS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #000000 0%, #4a4a4a 100%);
    color: white;
  }
  body {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }
  .status {
    font-size: 15px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
  }
  @media (max-width: 480px) {
    .logo { font-size: 32px; }
  }
</style>
</head>
<body>
  <div>
    <div class="logo">AskBS</div>
    <div class="status">Coming soon.</div>
  </div>
</body>
</html>
